      @keyframes marquee {

        }

      .grid {
        opacity: 0.3;
        z-index: 0;
        background-image: url(/images/grid.svg);
        background-position: 50%;
        background-repeat: repeat;
        background-size: cover;
        position: absolute;
        top: 0%;
        bottom: 0%;
        left: 0%;
        right: 0%;
      }
      .cloud {
        position: absolute;
        left: 0%;
        right: 0%;
      }
      .bg-grid {
        opacity: 0.3;
        z-index: 0;
        background-image: url(/images/more.webp);
        background-position: 50%;
        background-repeat: repeat;
        background-size: cover;
        position: absolute;
        top: 0%;
        bottom: 0%;
        left: 0%;
        right: 0%;
      }

  <body>

          <img

          <img

      <div

              />

            <svg
              xmlns="http://www.w3.org/2000/svg"

              height="24"
              viewBox="0 0 24 24"

              class="lucide lucide-twitter-icon lucide-twitter"
            >
              <path
                d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"

      <div
        class="marquee_container opacity-[.3] absolute font-aspergit font-bold text-2xl top-0 left-0 w-[10vw] h-full"
      >
        <div
          class="marquee h-full hidden md:flex flex-col gap-8 justify-center items-center overflow-hidden"
        >
          <div
            class="marquee_item md:text-[4.3em] text-[2em] flex items-center"
          >
            <p>comingsoon</p>
          </div>
          <div
            class="marquee_item md:text-[4.3em] text-[2em] flex items-center"
          >
            <p>comingsoon</p>
          </div>
          <div
            class="marquee_item md:text-[4.3em] text-[2em] flex items-center"
          >
            <p>comingsoon</p>

    </main>

    <script>
      function verticalLoop(items, config) {
        let timeline
        items = gsap.utils.toArray(items)
        config = config || {}
        gsap.context(() => {
          let onChange = config.onChange,
            lastIndex = 0,
            tl = gsap.timeline({
              repeat: config.repeat,
              onUpdate:
                onChange &&
                function () {
                  let i = tl.closestIndex()
                  if (lastIndex !== i) {
                    lastIndex = i
                    onChange(items[i], i)
                  }
                },
              paused: config.paused,
              defaults: { ease: 'none' },
              onReverseComplete: () =>
                tl.totalTime(tl.rawTime() + tl.duration() * 100),
            }),
            length = items.length,
            startY = items[0].offsetTop,
            times = [],
            heights = [],
            spaceBefore = [],
            yPercents = [],
            curIndex = 0,
            indexIsDirty = false,
            center = config.center,
            pixelsPerSecond = (config.speed || 1) * 100,
            snap =
              config.snap === false
                ? (v) => v
                : gsap.utils.snap(config.snap || 1),
            timeOffset = 0,
            container =
              center === true
                ? items[0].parentNode
                : gsap.utils.toArray(center)[0] || items[0].parentNode,
            totalHeight,
            getTotalHeight = () =>
              items[length - 1].offsetTop +
              (yPercents[length - 1] / 100) * heights[length - 1] -
              startY +
              spaceBefore[0] +
              items[length - 1].offsetHeight *
                gsap.getProperty(items[length - 1], 'scaleY') +
              (parseFloat(config.paddingBottom) || 0),
            populateHeights = () => {
              let b1 = container.getBoundingClientRect(),
                b2
              items.forEach((el, i) => {
                heights[i] = parseFloat(gsap.getProperty(el, 'height', 'px'))
                yPercents[i] = snap(
                  (parseFloat(gsap.getProperty(el, 'y', 'px')) / heights[i]) *
                    100 +
                    gsap.getProperty(el, 'yPercent')
                )
                b2 = el.getBoundingClientRect()
                spaceBefore[i] = b2.top - (i ? b1.bottom : b1.top)
                b1 = b2
              })
              gsap.set(items, {
                yPercent: (i) => yPercents[i],
              })
              totalHeight = getTotalHeight()
            },
            timeWrap,
            populateOffsets = () => {
              timeOffset = center
                ? (tl.duration() * (container.offsetHeight / 2)) / totalHeight
                : 0
              center &&
                times.forEach((t, i) => {
                  times[i] = timeWrap(
                    tl.labels['label' + i] +
                      (tl.duration() * heights[i]) / 2 / totalHeight -
                      timeOffset
                  )
                })
            },
            getClosest = (values, value, wrap) => {
              let i = values.length,
                closest = 1e10,
                index = 0,
                d
              while (i--) {
                d = Math.abs(values[i] - value)
                if (d > wrap / 2) {
                  d = wrap - d
                }
                if (d < closest) {
                  closest = d
                  index = i
                }
              }
              return index
            },
            populateTimeline = () => {
              let i, item, curY, distanceToStart, distanceToLoop
              tl.clear()
              for (i = 0; i < length; i++) {
                item = items[i]
                curY = (yPercents[i] / 100) * heights[i]
                distanceToStart =
                  item.offsetTop + curY - startY + spaceBefore[0]
                distanceToLoop =
                  distanceToStart +
                  heights[i] * gsap.getProperty(item, 'scaleY')
                tl.to(
                  item,
                  {
                    yPercent: snap(
                      ((curY - distanceToLoop) / heights[i]) * 100
                    ),
                    duration: distanceToLoop / pixelsPerSecond,
                  },
                  0
                )
                  .fromTo(
                    item,
                    {
                      yPercent: snap(
                        ((curY - distanceToLoop + totalHeight) / heights[i]) *
                          100
                      ),
                    },
                    {
                      yPercent: yPercents[i],
                      duration:
                        (curY - distanceToLoop + totalHeight - curY) /
                        pixelsPerSecond,
                      immediateRender: false,
                    },
                    distanceToLoop / pixelsPerSecond
                  )
                  .add('label' + i, distanceToStart / pixelsPerSecond)
                times[i] = distanceToStart / pixelsPerSecond
              }
              timeWrap = gsap.utils.wrap(0, tl.duration())
            },
            refresh = (deep) => {
              let progress = tl.progress()
              tl.progress(0, true)
              populateHeights()
              deep && populateTimeline()
              populateOffsets()
              deep && tl.draggable && tl.paused()
                ? tl.time(times[curIndex], true)
                : tl.progress(progress, true)
            },
            onResize = () => refresh(true),
            proxy
          gsap.set(items, { y: 0 })
          populateHeights()
          populateTimeline()
          populateOffsets()
          window.addEventListener('resize', onResize)
          function toIndex(index, vars) {
            vars = vars || {}
            Math.abs(index - curIndex) > length / 2 &&
              (index += index > curIndex ? -length : length)
            let newIndex = gsap.utils.wrap(0, length, index),
              time = times[newIndex]
            if (time > tl.time() !== index > curIndex && index !== curIndex) {
              time += tl.duration() * (index > curIndex ? 1 : -1)
            }
            if (time < 0 || time > tl.duration()) {
              vars.modifiers = { time: timeWrap }
            }
            curIndex = newIndex
            vars.overwrite = true
            gsap.killTweensOf(proxy)
            return vars.duration === 0
              ? tl.time(timeWrap(time))
              : tl.tweenTo(time, vars)
          }
          tl.toIndex = (index, vars) => toIndex(index, vars)
          tl.closestIndex = (setCurrent) => {
            let index = getClosest(times, tl.time(), tl.duration())
            if (setCurrent) {
              curIndex = index
              indexIsDirty = false
            }
            return index
          }
          tl.current = () => (indexIsDirty ? tl.closestIndex(true) : curIndex)
          tl.next = (vars) => toIndex(tl.current() + 1, vars)
          tl.previous = (vars) => toIndex(tl.current() - 1, vars)
          tl.times = times
          tl.progress(1, true).progress(0, true)
          if (config.reversed) {
            tl.vars.onReverseComplete()
            tl.reverse()
          }
          if (config.draggable && typeof Draggable === 'function') {
            proxy = document.createElement('div')
            let wrap = gsap.utils.wrap(0, 1),
              ratio,
              startProgress,
              draggable,
              dragSnap,
              lastSnap,
              initChangeY,
              wasPlaying,
              align = () =>
                tl.progress(
                  wrap(startProgress + (draggable.startY - draggable.y) * ratio)
                ),
              syncIndex = () => tl.closestIndex(true)
            typeof InertiaPlugin === 'undefined' &&
              console.warn(
                'InertiaPlugin required for momentum-based scrolling and snapping. https://greensock.com/club'
              )
            draggable = Draggable.create(proxy, {
              trigger: items[0].parentNode,
              type: 'y',
              onPressInit() {
                let y = this.y
                gsap.killTweensOf(tl)
                wasPlaying = !tl.paused()
                tl.pause()
                startProgress = tl.progress()
                refresh()
                ratio = 1 / totalHeight
                initChangeY = startProgress / -ratio - y
                gsap.set(proxy, { y: startProgress / -ratio })
              },
              onDrag: align,
              onThrowUpdate: align,
              overshootTolerance: 0,
              inertia: true,
              snap(value) {
                if (Math.abs(startProgress / -ratio - this.y) < 10) {
                  return lastSnap + initChangeY
                }
                let time = -(value * ratio) * tl.duration(),
                  wrappedTime = timeWrap(time),
                  snapTime =
                    times[getClosest(times, wrappedTime, tl.duration())],
                  dif = snapTime - wrappedTime
                Math.abs(dif) > tl.duration() / 2 &&
                  (dif += dif < 0 ? tl.duration() : -tl.duration())
                lastSnap = (time + dif) / tl.duration() / -ratio
                return lastSnap
              },
              onRelease() {
                syncIndex()
                draggable.isThrowing && (indexIsDirty = true)
              },
              onThrowComplete: () => {
                syncIndex()
                wasPlaying && tl.play()
              },
            })[0]
            tl.draggable = draggable
          }
          tl.closestIndex(true)
          lastIndex = curIndex
          onChange && onChange(items[curIndex])
          timeline = tl
          return () => window.removeEventListener('resize', onResize)
        })
        return timeline
      }

      const horizontalLoop = (items, config) => {
        items = gsap.utils.toArray(items)
        config = config || {}
        let tl = gsap.timeline({
            repeat: config.repeat,
            paused: config.paused,
            defaults: { ease: 'none' },
            onReverseComplete: () =>
              tl.totalTime(tl.rawTime() + tl.duration() * 100),
          }),
          length = items.length,
          startX = items[0].offsetLeft,
          times = [],
          widths = [],
          xPercents = [],
          curIndex = 0,
          pixelsPerSecond = (config.speed || 1) * 100,
          snap =
            config.snap === false
              ? (v) => v
              : gsap.utils.snap(config.snap || 1), // some browsers shift by a pixel to accommodate flex layouts, so for example if width is 20% the first element's width might be 242px, and the next 243px, alternating back and forth. So we snap to 5 percentage points to make things look more natural
          totalWidth,
          curX,
          distanceToStart,
          distanceToLoop,
          item,
          i
        gsap.set(items, {
          // convert "x" to "xPercent" to make things responsive, and populate the widths/xPercents Arrays to make lookups faster.
          xPercent: (i, el) => {
            let w = (widths[i] = parseFloat(
              gsap.getProperty(el, 'width', 'px')
            ))
            xPercents[i] = snap(
              (parseFloat(gsap.getProperty(el, 'x', 'px')) / w) * 100 +
                gsap.getProperty(el, 'xPercent')
            )
            return xPercents[i]
          },
        })
        gsap.set(items, { x: 0 })
        totalWidth =
          items[length - 1].offsetLeft +
          (xPercents[length - 1] / 100) * widths[length - 1] -
          startX +
          items[length - 1].offsetWidth *
            gsap.getProperty(items[length - 1], 'scaleX') +
          (parseFloat(config.paddingRight) || 0)
        for (i = 0; i < length; i++) {
          item = items[i]
          curX = (xPercents[i] / 100) * widths[i]
          distanceToStart = item.offsetLeft + curX - startX
          distanceToLoop =
            distanceToStart + widths[i] * gsap.getProperty(item, 'scaleX')
          tl.to(
            item,
            {
              xPercent: snap(((curX - distanceToLoop) / widths[i]) * 100),
              duration: distanceToLoop / pixelsPerSecond,
            },
            0
          )
            .fromTo(
              item,
              {
                xPercent: snap(
                  ((curX - distanceToLoop + totalWidth) / widths[i]) * 100
                ),
              },
              {
                xPercent: xPercents[i],
                duration:
                  (curX - distanceToLoop + totalWidth - curX) / pixelsPerSecond,
                immediateRender: false,
              },
              distanceToLoop / pixelsPerSecond
            )
            .add('label' + i, distanceToStart / pixelsPerSecond)
          times[i] = distanceToStart / pixelsPerSecond
        }
        function toIndex(index, vars) {
          vars = vars || {}
          Math.abs(index - curIndex) > length / 2 &&
            (index += index > curIndex ? -length : length) // always go in the shortest direction
          let newIndex = gsap.utils.wrap(0, length, index),
            time = times[newIndex]
          if (time > tl.time() !== index > curIndex) {
            // if we're wrapping the timeline's playhead, make the proper adjustments
            vars.modifiers = { time: gsap.utils.wrap(0, tl.duration()) }
            time += tl.duration() * (index > curIndex ? 1 : -1)
          }
          curIndex = newIndex
          vars.overwrite = true
          return tl.tweenTo(time, vars)
        }
        tl.next = (vars) => toIndex(curIndex + 1, vars)
        tl.previous = (vars) => toIndex(curIndex - 1, vars)
        tl.current = () => curIndex
        tl.toIndex = (index, vars) => toIndex(index, vars)
        tl.times = times
        tl.progress(1, true).progress(0, true) // pre-render for performance
        if (config.reversed) {
          tl.vars.onReverseComplete()
          tl.reverse()
        }
        return tl
      }
      const marqueeItems = gsap.utils.toArray('.marquee_item')
      const cloudMarqueeItems = gsap.utils.toArray('.cloud-marquee img')
      const cloudLoop = horizontalLoop(cloudMarqueeItems, {
        repeat: -1,
        paddingRight: 140,
        speed: 0.3,
        paused: true,
      })
      const loop = verticalLoop(marqueeItems, {
        repeat: -1,
        paddingBottom: 470,
        speed: 0.5,
        paused: true,
      })
      loop.play()
      cloudLoop.play()

      const link = document.querySelector('.blog')
      let mouseoverAnimation

      link.addEventListener('mouseover', () => {
        mouseoverAnimation = gsap.to(link, {
          opacity: 1,
          color: '#1aeaff',
          repeat: -1,
          duration: 0.3,
        })
      })
      link.addEventListener('mouseleave', () => {
        if (mouseoverAnimation) {
          mouseoverAnimation.kill()
        }
        gsap.to(link, {
          color: 'white',
          opacity: 0.5,
          duration: 0.3,
        })
      })

      document.addEventListener('DOMContentLoaded', () => {
        const main = document.querySelector('.info')
        const header = main.querySelector('.head')
        const comingSoonText = main.querySelectorAll('.coming-soon > p')
        const comingSoonTextSplit1 = new SplitType(comingSoonText[0], {
          types: 'chars',
          tagName: 'span',
        })
        const comingSoonTextSplit2 = new SplitType(comingSoonText[1], {
          types: 'chars',
          tagName: 'span',
        })
        gsap.fromTo(
          header,
          { y: '125%', opacity: 0 },
          { y: '0%', opacity: 1, duration: 1, ease: 'power2.out' }
        )
        gsap.fromTo(
          [comingSoonTextSplit1.chars, comingSoonTextSplit2.chars],
          { y: '100%', opacity: 0 },
          {
            y: '0%',
            opacity: 1,
            duration: 0.3,
            ease: 'power2.out',
            stagger: 0.05,
            delay: 0.5,
          }
        )
      })
    </script>
